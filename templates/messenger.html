{% extends 'base.html' %}

{% block title %}Мессенджер — WorldLink{% endblock %}

{% block content %}
<div class="messenger-container">
    <!-- Левая колонка: поиск и список активных диалогов -->
    <div class="chats-sidebar">
        <div class="messenger-search-box">
            <input type="text" id="userSearchInput" placeholder="Найти человека...">
            <div class="search-results-dropdown" id="searchResults" style="display: none;"></div>
        </div>
        <div class="chats-list" id="chatsList">
            <!-- Список реальных чатов с собеседниками -->
            <div class="empty-chats" style="padding: 20px; text-align: center; color: #888;">
                Нет активных диалогов. Найдите пользователя сверху!
            </div>
        </div>
    </div>

    <!-- Правая колонка: область переписки -->
    <div class="chat-area">
        <div class="chat-header" id="activeChatHeader" style="display: none;">
            <div class="avatar-placeholder" id="currentAvatar">?</div>
            <div class="chat-contact-info">
                <h3 id="currentChatName">Имя собеседника</h3>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="no-chat-selected">Выберите чат или найдите пользователя для начала общения</div>
        </div>

        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <div class="file-preview-container" id="filePreview" style="display: none;">
                <span id="fileName"></span>
                <button id="removeFileBtn">&times;</button>
            </div>
            <div class="input-wrapper">
                <button class="attach-btn" title="Прикрепить файл"><i class="fa fa-paperclip"></i></button>
                <input type="file" id="fileInput" style="display: none;">
                <input type="text" placeholder="Введите сообщение...">
                <button class="send-btn" title="Отправить"><i class="fa fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
